<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profilim — DestekHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">👤 Profilim</h1>
      <p class="page-subtitle">Hesap bilgilerinizi görüntüleyin ve güncelleyin.</p>
    </div>

    <div style="display:grid;grid-template-columns:1fr 2fr;gap:24px;align-items:start;">
      <!-- Profil Kartı -->
      <div style="display:flex;flex-direction:column;gap:16px;">
        <div class="card">
          <div class="card-body" style="text-align:center;padding:32px 24px;">
            <div id="profileAvatar" style="width:80px;height:80px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:800;margin:0 auto 16px;"></div>
            <div id="profileName" style="font-size:1.2rem;font-weight:700;color:var(--gray-900);margin-bottom:4px;"></div>
            <div id="profileEmail" style="font-size:0.875rem;color:var(--gray-500);margin-bottom:12px;"></div>
            <div id="profileRole"></div>
          </div>
        </div>

        <!-- İstatistikler -->
        <div class="card" id="statsCard">
          <div class="card-header">
            <h3 class="card-title">📊 İstatistiklerim</h3>
          </div>
          <div class="card-body" style="padding:0 24px;" id="statsContent"></div>
        </div>
      </div>

      <!-- Düzenleme Formları -->
      <div style="display:flex;flex-direction:column;gap:20px;">
        <!-- Bilgi Güncelleme -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">✏️ Bilgileri Güncelle</h3>
          </div>
          <div class="card-body">
            <div id="profileAlert"></div>
            <form id="profileForm" novalidate>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Ad Soyad <span class="required">*</span></label>
                  <input type="text" id="fullName" class="form-control">
                </div>
                <div class="form-group">
                  <label class="form-label">Kullanıcı Adı <span class="required">*</span></label>
                  <input type="text" id="username" class="form-control">
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">E-posta <span class="required">*</span></label>
                <input type="email" id="email" class="form-control">
              </div>
              <div style="display:flex;justify-content:flex-end;">
                <button type="submit" class="btn btn-primary">💾 Kaydet</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Şifre Değiştirme -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">🔒 Şifre Değiştir</h3>
          </div>
          <div class="card-body">
            <div id="passwordAlert"></div>
            <form id="passwordForm" novalidate>
              <div class="form-group">
                <label class="form-label">Mevcut Şifre <span class="required">*</span></label>
                <input type="password" id="currentPassword" class="form-control" placeholder="Mevcut şifreniz">
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Yeni Şifre <span class="required">*</span></label>
                  <input type="password" id="newPassword" class="form-control" placeholder="En az 8 karakter">
                </div>
                <div class="form-group">
                  <label class="form-label">Yeni Şifre Tekrar <span class="required">*</span></label>
                  <input type="password" id="confirmNewPassword" class="form-control" placeholder="Şifreyi tekrar girin">
                </div>
              </div>
              <div style="display:flex;justify-content:flex-end;">
                <button type="submit" class="btn btn-primary">🔐 Şifreyi Güncelle</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Hesap Bilgileri -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">ℹ️ Hesap Bilgileri</h3>
          </div>
          <div class="card-body" style="padding:0 24px;">
            <div class="info-list" id="accountInfo"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="js/app.js"></script>
  <script>
    let session;
    let currentUser;

    document.addEventListener('DOMContentLoaded', () => {
      if (!Auth.requireAuth('login.html')) return;
      session = Auth.getSession();
      currentUser = DataStore.Users.getById(session.userId);
      renderProfile();
      setupForms();
    });

    function renderProfile() {
      const avatarColors = { admin: 'var(--warning)', support: 'var(--success)', user: 'var(--primary)' };
      document.getElementById('profileAvatar').textContent = Utils.getInitials(currentUser.fullName);
      document.getElementById('profileAvatar').style.background = avatarColors[currentUser.role];
      document.getElementById('profileName').textContent = currentUser.fullName;
      document.getElementById('profileEmail').textContent = currentUser.email;
      document.getElementById('profileRole').innerHTML = `<span class="role-badge ${currentUser.role}">${UserRole.labels[currentUser.role]}</span>`;

      // Form doldur
      document.getElementById('fullName').value = currentUser.fullName;
      document.getElementById('username').value = currentUser.username;
      document.getElementById('email').value = currentUser.email;

      // İstatistikler
      const myTickets = DataStore.Tickets.filter({ userId: currentUser.id });
      const statsHtml = [
        { label: 'Toplam Talep', value: myTickets.length },
        { label: 'Açık Talep', value: myTickets.filter(t=>t.status==='open').length },
        { label: 'Çözülen Talep', value: myTickets.filter(t=>t.status==='resolved'||t.status==='closed').length },
        { label: 'Toplam Yorum', value: myTickets.reduce((s,t)=>s+t.comments.filter(c=>c.userId===currentUser.id).length, 0) }
      ].map(s => `
        <div class="info-item">
          <span class="info-key">${s.label}</span>
          <span class="info-value" style="font-size:1.1rem;font-weight:800;color:var(--primary);">${s.value}</span>
        </div>
      `).join('');
      document.getElementById('statsContent').innerHTML = `<div class="info-list">${statsHtml}</div>`;

      // Hesap bilgileri
      document.getElementById('accountInfo').innerHTML = `
        <div class="info-item">
          <span class="info-key">Kullanıcı ID</span>
          <span class="info-value" style="font-family:monospace;">#${currentUser.id}</span>
        </div>
        <div class="info-item">
          <span class="info-key">Kullanıcı Adı</span>
          <span class="info-value">@${Utils.escapeHtml(currentUser.username)}</span>
        </div>
        <div class="info-item">
          <span class="info-key">Kayıt Tarihi</span>
          <span class="info-value">${Utils.formatDate(currentUser.createdAt)}</span>
        </div>
        <div class="info-item">
          <span class="info-key">Hesap Durumu</span>
          <span class="info-value" style="color:var(--success);font-weight:600;">● Aktif</span>
        </div>
      `;
    }

    function setupForms() {
      // Profil güncelleme
      document.getElementById('profileForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const data = {
          fullName: document.getElementById('fullName').value.trim(),
          username: document.getElementById('username').value.trim(),
          email: document.getElementById('email').value.trim()
        };

        const schema = {
          fullName: [{ type: 'required' }, { type: 'minLength', value: 3 }],
          username: [{ type: 'required' }, { type: 'minLength', value: 3 }],
          email: [{ type: 'required' }, { type: 'email' }]
        };

        const { valid, errors } = Validator.validateForm(data, schema);
        if (!valid) {
          Object.entries(errors).forEach(([f, msg]) => {
            const el = document.getElementById(f);
            if (el) Validator.showFieldError(el, msg);
          });
          return;
        }

        // E-posta benzersizlik
        const existing = DataStore.Users.getByEmail(data.email);
        if (existing && existing.id !== currentUser.id) {
          Validator.showFieldError(document.getElementById('email'), 'Bu e-posta başka bir hesapta kullanılıyor.');
          return;
        }

        DataStore.Users.update(currentUser.id, data);
        currentUser = DataStore.Users.getById(currentUser.id);

        // Session güncelle
        const newSession = { ...session, fullName: data.fullName, email: data.email };
        sessionStorage.setItem('ticketSystemSession', JSON.stringify(newSession));
        session = newSession;

        renderProfile();
        NavbarComponent.render();
        document.getElementById('profileAlert').innerHTML = `<div class="alert alert-success"><span class="alert-icon">✅</span> Bilgileriniz güncellendi.</div>`;
        Toast.success('Profil güncellendi.');
      });

      // Şifre değiştirme
      document.getElementById('passwordForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const currentPass = document.getElementById('currentPassword').value;
        const newPass = document.getElementById('newPassword').value;
        const confirmPass = document.getElementById('confirmNewPassword').value;

        Validator.clearFormErrors(this);

        if (!currentPass) {
          Validator.showFieldError(document.getElementById('currentPassword'), 'Mevcut şifre zorunludur.');
          return;
        }
        if (currentUser.password !== currentPass) {
          Validator.showFieldError(document.getElementById('currentPassword'), 'Mevcut şifre hatalı.');
          return;
        }
        if (!newPass || newPass.length < 8) {
          Validator.showFieldError(document.getElementById('newPassword'), 'Yeni şifre en az 8 karakter olmalıdır.');
          return;
        }
        if (newPass !== confirmPass) {
          Validator.showFieldError(document.getElementById('confirmNewPassword'), 'Şifreler eşleşmiyor.');
          return;
        }

        DataStore.Users.update(currentUser.id, { password: newPass });
        currentUser = DataStore.Users.getById(currentUser.id);
        this.reset();
        document.getElementById('passwordAlert').innerHTML = `<div class="alert alert-success"><span class="alert-icon">✅</span> Şifreniz başarıyla güncellendi.</div>`;
        Toast.success('Şifre güncellendi.');
      });
    }
  </script>
</body>
</html>
